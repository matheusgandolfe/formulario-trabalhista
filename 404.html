<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário de Entrevista – Ação Trabalhista</title>
<script>
  // GitHub Pages não tem rotas: um link como /formulario-trabalhista/erika-silva-10720-v1
  // cai aqui. Redireciona para a página do formulário levando o final do link em ?p=
  (function () {
    var base = '/formulario-trabalhista/';
    var path = location.pathname;
    var resto = path.indexOf(base) === 0 ? path.slice(base.length).replace(/\/+$/, '') : '';
    if (resto === 'lista') {
      location.replace(base + 'lista.html');
    } else if (resto) {
      location.replace(base + '?p=' + encodeURIComponent(path.slice(base.length)));
    } else {
      location.replace(base);
    }
  })();
</script>
</head>
<body></body>
</html>
