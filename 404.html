<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário de Entrevista – Ação Trabalhista</title>
<script>
  // Link antigo (GitHub Pages, /formulario-trabalhista/...) -> domínio próprio, mantendo o final do link.
  // No domínio próprio (Vercel) as rotas são resolvidas pelo vercel.json; endereço desconhecido volta pro início.
  (function () {
    if (location.hostname.endsWith('github.io')) {
      var resto = location.pathname.replace(/^\/formulario-trabalhista\/?/, '');
      if (resto === 'lista.html') resto = 'lista';
      location.replace('https://entrevista.grupogv.app.br/' + resto + location.search + location.hash);
    } else {
      location.replace('/');
    }
  })();
</script>
</head>
<body></body>
</html>
